name: validate-skills
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, descriptions and upload limits
        run: python tools/validate_skills.py
      - name: Bundled script self-tests
        run: |
          pip install numpy pandas scipy matplotlib rasterio
          python tools/selftest.py
